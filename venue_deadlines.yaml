# 会议/期刊的投稿截止日表 —— **运维方维护，模型不得增改**
#
# ## 这张表解决什么问题
#
# `predates_paper_submission` 是全系统唯一的硬门控：一份指南发布于论文投稿之后，
# 就**不得用来指责作者**。它需要两个日期，其中"论文投稿日"通常从论文自身取得
# （`Received:` / `Accepted:` / 文献检索截止日，见 prompts/stage1_overview.md §③ 阶梯）。
#
# **会议的匿名送审稿三档全落空** —— ICLR/NeurIPS 这类 PDF 上没有任何日期。
# 阶段一会正确地停在第 4 档 `unavailable`，于是 `validate_card()` 硬报错、卡进不了检索。
# 而 ICLR 的 MedAI 论文正是 MVP 评测的目标语料（DESIGN.md §8）。
#
# 决议（2026-08-01）：给阶梯加**第 5 档 `venue_deadline`**，日期由本表提供。
#
# ## 三条规矩
#
# 1. **模型不得凭记忆推断本表的任何取值。** 模型被问"ICLR 2024 什么时候截止"会给出一个
#    看起来很像的日期，而**猜错了没有任何地方会报错** —— 错日期是"最像正确"的那种错
#    （同"不让模型填页码"，PIPELINE_WALKTHROUGH §3④）。
#    `claim_card.validate_card()` 会拿卡上的日期与本表**逐字比对**，对不上就是硬错误，
#    因此手工往卡里敲一个日期也绕不过去。
#
#    **2026-08-02 修订（运维方决定）**：允许模型**抓取官方页面**代填，条件是
#    ① `source_url` 必须是实际抓过的那一页，不得编造；
#    ② `verified_by` 写明"是模型抓的、未经人工复核"，不得冒充人工核实。
#    禁的始终是**凭记忆生成日期**，不是"取数这件事本身"。
#
#    这条修订当场就证明了自己有用：原表里 ICLR 2024 的 `2023-09-22` 是临时脚本按印象
#    写的，抓官网发现实际是 **09-23**（且是从原定的 09-21 推迟而来）—— 三个候选值
#    彼此只差一两天，全都"看起来很对"。
#
# 2. **`use` 取更早的那一档（有摘要截止就用摘要截止）。** 方向性理由：
#    日期填得越早 → 越多指南被判成"投稿时尚不存在" → 越少拿标准去要求作者 → **安全侧**。
#    反过来填晚了，就是拿作者当时看不到的标准指责他，直接违反铁律
#    （同 SPEC §10「取 Received 不取 Published」，LungIMPACT 那篇两者差 5.5 个月）。
#
# 3. **论文自带日期时本表不生效。** 期刊论文有 `Received:`，那是每篇各自的真实日期，
#    比"全会议一个常数"精确得多。`extract.py stamp-date` 只在 `submission_date: null`
#    时才补，已有日期一律跳过。
#
# ## 已知的粗糙之处（用它出报告时要能说清楚）
#
# - **这是"每会议每年一个常数"，不是每篇论文各自的投稿时刻。** 同一届的所有论文共用
#   一个日期。比真实值粗，但对评测反而有利：同一批论文时间基准统一，可比。
# - **重投的论文会偏晚**（NeurIPS 被拒改投 ICLR）。但我们审的是这个版本，作者到该届
#   截止日为止都有机会补上新出的标准，所以用本届截止日是对的。
# - **拿到的若是 camera-ready 而非送审稿**，作者有过一轮修改机会，正确锚点应更晚；
#   本表按送审稿口径给值，即再次落在安全侧。
#
# ## 怎么加一届
#
#   1. 找官方 CFP / 会议主页上写着截止日的那一页，把 URL 填进 `source_url`；
#   2. `abstract_deadline` / `paper_deadline` 照抄（注意时区：写日期即可，不写时刻）；
#   3. `use` 指向更早的那个字段名；
#   4. 亲自核对过之后，把 `verified_by` 填成"谁 + 哪天核的"。**留空会在校验时告警**
#      （不阻断，但报告里这条日期不能声称已核实）。

schema_version: 1
maintained_by: operator          # 人工。模型只读不写。

# 下面所有条目的 verified_by 都是同一句 —— 2026-08-02 由模型逐个抓取 source_url
# 所指页面填入，**没有人复核过**。要转成人工已核，把 verified_by 改成"<谁> <哪天>"。

