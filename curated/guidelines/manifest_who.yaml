    issuing_body: "World Health Organization"
    tier: 1
    region: null                      # WHO 指南面向全球，留空即不限地区
    scope:
      disease_terms:
        - "rheumatic fever"
        - "rheumatic heart disease"
        - "group A streptococcal pharyngitis"
        - "streptococcal pharyngitis"
        - "GAS pharyngitis"
      care_settings: ["primary care", "outpatient", "community", "inpatient"]
      population: null                # 覆盖 children/adolescents/adults 三段，留空不拦
      topic: "GAS 咽炎的诊断与抗生素治疗、超声心动图筛查（含简化方案）、BPG 二级预防"
    notes: >-
      对**心脏超声 AI 筛查**类论文最直接的规范来源：Recommendation 1–3（诊断章）
      明确了在什么人群、用什么设备做超声心动图筛查，以及证据确定性；论文若声称
      "AI 心超筛查 RHD"，其目标人群与设备档次必须对得上这几条。另含 6 条
      "No recommendation"（WHO 明示无法作出推荐），对"能力边界"审查尤其有用。

  - uuid: af9ab127-3184-4102-9745-60c604bc2aa1
