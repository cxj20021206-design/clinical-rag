# WHO IRIS 指南的策展清单 —— source_role = normative，source_id = who_guidelines
#
# 与 manifest.yaml（学会/国家 CPG，走 Europe PMC）分开的理由是**通道不同而非可信度
# 不同**：这里的条目同样经人工确认 scope，curation_level 也是 curated。产物命名
# cpg_who_*.yaml，被 curated_guidelines.py 的 cpg_*.yaml glob 直接吃到，门控共用。
#
# 入选条件（三条同时满足，与 §6d 一致）：
#   ① dc.rights 在许可白名单内 —— **空 = 未授权**，不是"待查"；
#   ② 有英文 TEXT bundle（DSpace 预抽文本）；
#   ③ 推荐以编号锚点结构呈现（Recommendation N / Good practice statement /
#      No recommendation），抽出 ≥3 条。不满足的记入 deferred 并写明成因，
#      **不做关键词抓句降级**。
#
# scope 由人工确认：它决定系统拿这份指南去要求论文做什么。disease_terms 避免裸词
# （§6e 的教训：wses 的裸词 injury 让「acute kidney injury」卡命中老年创伤指南）；
# population 两可时留空 —— 留空 = 不拦，是安全侧，写错会把整份指南永久拦死。

