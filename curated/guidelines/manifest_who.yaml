    short_name: "WHO TB guidelines module 3: diagnosis (2025)"
    issuing_body: "World Health Organization"
    tier: 1
    region: null
    scope:
      disease_terms:
        - tuberculosis
        - "pulmonary tuberculosis"
        - "drug-resistant tuberculosis"
        - "rifampicin-resistant tuberculosis"
        - "MDR/RR-TB"
      care_settings: ["primary care", "outpatient", "inpatient", "laboratory"]
      population: null                # adults / adolescents / children 均有条目
      topic: "结核的分子诊断与耐药检测（低/中复杂度自动化 NAAT、LPA、靶向测序）的适用人群与替代关系"
    notes: >-
      结核诊断 AI 论文的对照标准来源：这些推荐规定了**新检测该跟谁比**
      （"may be used as a replacement test for sputum-smear microscopy"、
      "rather than culture-based phenotypic DST"），正是 comparator_baseline
      模块要对齐的现实基线。

  - uuid: 8132c5ef-0f8e-40f0-9d4d-1f596271695d
    slug: intrapartum_care_2018
    short_name: "WHO intrapartum care recommendations 2018"
    issuing_body: "World Health Organization"
    tier: 1
    region: null
    scope:
      disease_terms:
        - "intrapartum care"
        - "labour and childbirth"
        - childbirth
        - "fetal well-being"
        - cardiotocography
        - "fetal monitoring"
      care_settings: ["inpatient", "labour ward", "health facility", "hospital"]
      population: null                # 产妇为成人，但含新生儿条目（如吸引清理），留空不拦
      topic: "正常产程与分娩照护：产程定义与进展、胎儿监护方式、产程干预的适用与不适用"
    notes: >-
      对**胎心监护（CTG）AI** 类论文价值极高：RECOMMENDATION 17 明确
      "Continuous cardiotocography is not recommended for assessment of fetal
      well-being in healthy pregnant women"。一篇做"AI 分析连续 CTG"的论文
      必须先回答"WHO 不推荐常规做这项检查"这个前提。全份 53 条里有 21 条是
      **Not recommended**，是"不该做什么"这一侧最密集的规范来源。
      注意本指南用 WHO 母婴健康自己的分级体系（Recommended / Not recommended /
      Context-specific），不是 GRADE strong/conditional，未做归一化。

