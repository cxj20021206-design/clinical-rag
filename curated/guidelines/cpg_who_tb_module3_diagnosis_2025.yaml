- statement: Recommendation 20. Interferon-gamma release assays (IGRAs) (and the tuberculin skin test
    [TST]) should not be used in low- and middle-income countries for the diagnosis of pulmonary or extrapulmonary
    TB, or for the diagnostic work-up of adults (including people living with HIV) suspected of active
    TB in these settings (strong recommendation) The Guideline Development Group concluded that both the
    sensitivity and specificity of IGRAs in detecting active TB among individuals presumed of having TB
    were suboptimal and the quality of evidence was low.
  context: assays for the diagnosis of TB disease
  section: Recommendation 20
  recommendation_strength: strong
  grade_letter: null
  evidence_certainty: null
  agreement: null
