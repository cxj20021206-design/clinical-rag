recommendations:
- statement: Recommendations 1. For adults and adolescents with signs or symptoms of TB or who screened
    positive for pulmonary TB, low-complexity automated NAATs should be used on respiratory samples as
    initial diagnostic tests for TB rather than smear microscopy or culture. (Strong recommendation, high
    certainty of evidence)
  context: 2. Recommendations for diagnosis of TB disease 11
  section: Recommendations 1
  recommendation_strength: strong
  grade_letter: null
  evidence_certainty: high
  agreement: null
  is_no_recommendation: false
- statement: Recommendation 5. In people with signs and symptoms of pulmonary TB, moderate complexity
    automated NAATs may be used on respiratory samples for the detection of pulmonary TB, and of rifampicin
    and isoniazid rsesistance, rather than culture and phenotypic DST. (Conditional recommendation, moderate
    certainty of evidence for diagnostic accuracy)
  context: 2. Recommendations for diagnosis of TB disease 25
