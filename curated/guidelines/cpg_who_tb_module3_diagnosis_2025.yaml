- statement: Recommendations 7. For adults and adolescents with HIV who have signs or symptoms of TB,
    screen positive for TB, are seriously ill or have advanced HIV disease, concurrent testing using low-complexity
    automated NAATs on respiratory samples and LF-LAM on urine should be used as the initial diagnostic
    strategy for diagnosing TB rather than low-complexity automated NAATs on respiratory samples alone.
    (Strong recommendation, low certainty of evidence)
  context: 2.3.1 Concurrent use of tests in people living with HIV
  section: Recommendations 7
  recommendation_strength: strong
  grade_letter: null
  evidence_certainty: low
  agreement: null
  is_no_recommendation: false
- statement: Recommendations 8. For children who are HIV-negative or have an unknown HIV status, who have
    signs or symptoms or screen positive for pulmonary TB, concurrent testing using low-complexity automated
    NAATs on respiratory and stool samples should be used as the initial diagnostic strategy for diagnosing
    TB rather than low-complexity automated NAATs on respiratory or stool samples alone. (Strong recommendation,
    low certainty of evidence for test accuracy)
  context: or with unknown HIV status
