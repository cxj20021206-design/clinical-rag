- statement: Recommendations 6. For adults and adolescents with signs or symptoms or who screen positive
    for pulmonary TB, low-complexity manual NAATs should be used on respiratory samples as initial diagnostic
    tests for TB rather than smear microscopy or culture. (Strong recommendation, high certainty of evidence)
  context: 'The publication WHO operational handbook on tuberculosis. Module 3: Diagnosis describes'
  section: Recommendations 6
