    text: The USPSTF strongly recommends Rh(D) blood typing and antibody testing for all pregnant women
      during their first visit for pregnancy-related care.
    grade: A
    certainty: high
    grade_meaning: 高确定性，净收益大
  - population: Unsensitized Rh(D)-negative pregnant women
    text: The USPSTF recommends repeated Rh(D) antibody testing for all unsensitized Rh(D)-negative women
      at 24 to 28 weeks' gestation, unless the biological father is known to be Rh(D)-negative.
    grade: B
    certainty: moderate
    grade_meaning: 高确定性净收益中等，或中等确定性净收益中至大
