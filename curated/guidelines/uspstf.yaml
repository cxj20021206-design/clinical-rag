- slug: falls-prevention-community-dwelling-older-adults-interventions
  title: 'Falls Prevention in Community-Dwelling Older Adults: Interventions'
  url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/falls-prevention-community-dwelling-older-adults-interventions
  publication_date: '2024-06-04'
  type: Counseling
  age_group: Senior
  category: Injury Prevention, Musculoskeletal Disorders
  index_year: '2024'
  recommendations:
  - population: Community-dwelling adults 65 years or older
    text: The USPSTF recommends exercise interventions to prevent falls in community-dwelling adults 65
      years or older who are at increased risk for falls.
    grade: B
    certainty: moderate
    grade_meaning: 高确定性净收益中等，或中等确定性净收益中至大
  - population: Community-dwelling adults 65 years or older
    text: "The USPSTF recommends that clinicians individualize the decision to offer multifactorial interventions\
      \ to prevent falls to community-dwelling adults 65 years or older who are at increased risk for\
      \ falls. Existing evidence indicates that the overall net benefit of routinely offering multifactorial\
      \ interventions to prevent falls is small. When determining whether this service is appropriate\
      \ for an individual, patients and clinicians should consider the balance of benefits and harms based\
      \ on the circumstances of prior falls, presence of comorbid medical conditions, and the patient's\
      \ values and preferences.\r\n\nSee the Practice Considerations section for information on risk assessment\
      \ for falls."
    grade: C
    certainty: moderate
    grade_meaning: 中等确定性净收益小；应按个体情况选择性提供
