      cancer. Existing evidence indicates that the net benefit of counseling all adults older than 24
      years is small. In determining whether counseling is appropriate in individual cases, patients and
      clinicians should consider the presence of risk factors for skin cancer.


      See the Clinical Considerations section for information on risk assessment.'
    grade: C
    certainty: moderate
    grade_meaning: 中等确定性净收益小；应按个体情况选择性提供
