- slug: prostate-cancer-screening
  title: 'Prostate Cancer: Screening'
  url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/prostate-cancer-screening
  publication_date: '2018-05-08'
  type: Screening
  age_group: Adult, Senior
  category: Cancer
  index_year: '2018'
  recommendations:
  - population: Men aged 55 to 69 years
    text: For men aged 55 to 69 years, the decision to undergo periodic prostate-specific antigen (PSA)-based
      screening for prostate cancer should be an individual one. Before deciding whether to be screened,
      men should have an opportunity to discuss the potential benefits and harms of screening with their
      clinician and to incorporate their values and preferences in the decision. Screening offers a small
      potential benefit of reducing the chance of death from prostate cancer in some men. However, many
      men will experience potential harms of screening, including false-positive results that require
      additional testing and possible prostate biopsy; overdiagnosis and overtreatment; and treatment
      complications, such as incontinence and erectile dysfunction. In determining whether this service
      is appropriate in individual cases, patients and clinicians should consider the balance of benefits
      and harms on the basis of family history, race/ethnicity, comorbid medical conditions, patient values
      about the benefits and harms of screening and treatment-specific outcomes, and other health needs.
      Clinicians should not screen men who do not express a preference for screening.
    grade: C
    certainty: moderate
    grade_meaning: 中等确定性净收益小；应按个体情况选择性提供
  - population: Men 70 years and older
    text: The USPSTF recommends against PSA-based screening for prostate cancer in men 70 years and older.
    grade: D
    certainty: moderate
    grade_meaning: 中等/高确定性无净收益或弊大于利；不建议提供
