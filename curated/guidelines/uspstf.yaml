- slug: intimate-partner-violence-and-abuse-of-elderly-and-vulnerable-adults-screening
  title: 'Intimate Partner Violence and Caregiver Abuse of Older or Vulnerable Adults: Screening'
  url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/intimate-partner-violence-and-abuse-of-elderly-and-vulnerable-adults-screening
  publication_date: '2025-06-24'
  type: Screening
  age_group: Adolescent, Adult, Senior
  category: Injury Prevention, Mental Health Conditions and Substance Abuse, Miscellaneous
  index_year: '2025'
  recommendations:
  - population: Women of reproductive age, including pregnant and postpartum women
    text: "The USPSTF recommends that clinicians screen for intimate partner violence (IPV) in women of\
      \ reproductive age, including those who are pregnant and postpartum. \r\n\nSee the \"Practice Considerations\"\
      \ section for information on evidence-based multicomponent interventions and for information on\
      \ IPV in men."
    grade: B
    certainty: moderate
    grade_meaning: 高确定性净收益中等，或中等确定性净收益中至大
  - population: Older or vulnerable adults
    text: "The USPSTF concludes that the current evidence is insufficient to assess the balance of benefits\
      \ and harms of screening for caregiver abuse and neglect in older or vulnerable adults.\r\n\nSee\
      \ the \"Practice Considerations\" section for additional information."
    grade: I
    certainty: insufficient
    grade_meaning: 证据不足，无法评估收益与危害的平衡
