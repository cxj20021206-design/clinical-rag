  type: Screening
  age_group: Adult, Senior
  category: Musculoskeletal Disorders
  index_year: '2025'
  recommendations:
  - population: Women 65 years or older
    text: "The USPSTF recommends screening for osteoporosis to prevent osteoporotic fractures in women\
      \ 65 years or older.\r\n\nSee the \"Practice Considerations\" section for more information on screening\
      \ tests."
    grade: B
    certainty: moderate
    grade_meaning: 高确定性净收益中等，或中等确定性净收益中至大
  - population: Postmenopausal women younger than 65 years with 1 or more risk factors for osteoporosis
    text: "The USPSTF recommends screening for osteoporosis to prevent osteoporotic fractures in postmenopausal\
      \ women younger than 65 years who are at increased risk for an osteoporotic fracture as estimated\
      \ by clinical risk assessment.\r\n\nSee the \"Practice Considerations\" section for more information\
      \ on risk assessment and screening tests."
    grade: B
    certainty: moderate
    grade_meaning: 高确定性净收益中等，或中等确定性净收益中至大
  - population: Men
    text: "The USPSTF concludes that the current evidence is insufficient to assess the balance of benefits\
      \ and harms of screening for osteoporosis to prevent osteoporotic fractures in men.\r\n\nSee the\
      \ \"Practice Considerations\" section for suggestions for practice regarding the I statement."
    grade: I
    certainty: insufficient
    grade_meaning: 证据不足，无法评估收益与危害的平衡
