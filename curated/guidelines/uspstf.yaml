- slug: statin-use-in-adults-preventive-medication
  title: 'Statin Use for the Primary Prevention of Cardiovascular Disease in Adults: Preventive Medication'
  url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/statin-use-in-adults-preventive-medication
  publication_date: '2022-08-23'
  type: Preventive medication
  age_group: Adult, Senior
  category: Cardiovascular Disorders (Heart and Vascular Diseases)
  index_year: '2022'
  recommendations:
  - population: Adults aged 40 to 75 years who have 1 or more cardiovascular risk factors and an estimated
      10-year cardiovascular disease (CVD) risk of 10% or greater
    text: The USPSTF recommends that clinicians prescribe a statin for the primary prevention of CVD for
      adults aged 40 to 75 years who have 1 or more CVD risk factors (i.e. dyslipidemia, diabetes, hypertension,
      or smoking) and an estimated 10-year risk of a cardiovascular event of 10% or greater.
    grade: B
    certainty: moderate
    grade_meaning: 高确定性净收益中等，或中等确定性净收益中至大
  - population: Adults aged 40 to 75 years who have 1 or more cardiovascular risk factors and an estimated
      10-year CVD risk of 7.5% to less than 10%
    text: The USPSTF recommends that clinicians selectively offer a statin for the primary prevention
      of CVD for adults aged 40 to 75 years who have 1 or more CVD risk factors (i.e dyslipidemia, diabetes,
      hypertension, or smoking) and an estimated 10-year risk of a cardiovascular event of 7.5% to less
      than 10%. The likelihood of benefit is smaller in this group than in persons with a 10-year risk
      of 10% or greater.
    grade: C
    certainty: moderate
    grade_meaning: 中等确定性净收益小；应按个体情况选择性提供
  - population: Adults 76 years or older
    text: The USPSTF concludes that the current evidence is insufficient to assess the balance of benefits
      and harms of initiating a statin for the primary prevention of CVD events and mortality in adults
      76 years or older.
    grade: I
    certainty: insufficient
    grade_meaning: 证据不足，无法评估收益与危害的平衡
