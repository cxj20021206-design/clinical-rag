grade_definitions:
  A:
    certainty: high
    meaning: 高确定性，净收益大
  B:
    certainty: moderate
    meaning: 高确定性净收益中等，或中等确定性净收益中至大
  C:
    certainty: moderate
    meaning: 中等确定性净收益小；应按个体情况选择性提供
  D:
    certainty: moderate
    meaning: 中等/高确定性无净收益或弊大于利；不建议提供
  I:
    certainty: insufficient
    meaning: 证据不足，无法评估收益与危害的平衡
