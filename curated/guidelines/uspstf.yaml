  type: Screening
  age_group: Adolescent, Adult, Senior
  category: Cancer
  index_year: '2018'
  recommendations:
  - population: Women aged 21 to 65 years
    text: 'The USPSTF recommends screening for cervical cancer every 3 years with cervical cytology alone
      in women aged 21 to 29 years. For women aged 30 to 65 years, the USPSTF recommends screening every
      3 years with cervical cytology alone, every 5 years with high-risk human papillomavirus (hrHPV)
      testing alone, or every 5 years with hrHPV testing in combination with cytology (cotesting).


      See the Clinical Considerations section for the relative benefits and harms of alternative screening
      strategies for women 21 years or older.'
    grade: A
    certainty: high
    grade_meaning: 高确定性，净收益大
  - population: Women younger than 21 years
    text: The USPSTF recommends against screening for cervical cancer in women younger than 21 years.
    grade: D
    certainty: moderate
    grade_meaning: 中等/高确定性无净收益或弊大于利；不建议提供
  - population: Women who have had a hysterectomy
    text: The USPSTF recommends against screening for cervical cancer in women who have had a hysterectomy
      with removal of the cervix and do not have a history of a high-grade precancerous lesion (ie, cervical
      intraepithelial neoplasia [CIN] grade 2 or 3) or cervical cancer.
    grade: D
    certainty: moderate
    grade_meaning: 中等/高确定性无净收益或弊大于利；不建议提供
  - population: Women older than 65 years
    text: 'The USPSTF recommends against screening for cervical cancer in women older than 65 years who
      have had adequate prior screening and are not otherwise at high risk for cervical cancer.


      See the Clinical Considerations section for discussion of adequate prior screening and risk factors
      that support screening after age 65 years.'
    grade: D
    certainty: moderate
    grade_meaning: 中等/高确定性无净收益或弊大于利；不建议提供
