- statement: We recommend discussing in a multidisciplinary approach the end of life in an elderly patient
    in the trauma setting. The decision should be considering the patient’s directives, family feelings
    and representatives desires and should be shared [Strong recommendation based on a low-very low quality
    of evidence 1D]
