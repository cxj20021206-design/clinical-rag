  evidence_certainty: null
  agreement: null
- statement: We recommend administering venous thromboembolism prophylaxis with LMWH or UFH as soon as
    possible in high and moderate risk elderly patients in the trauma setting according to the renal function,
    weight of the patient and bleeding risk [Strong recommendation based on a low quality level of evidence
    1C]
  context: List of recommendations
