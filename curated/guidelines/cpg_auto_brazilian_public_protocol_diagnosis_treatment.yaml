recommendations:
- statement: We recommend using alteplase in patients with AIS in any vascular territory with symptom
    onset up to 4.5 hours (moderate-quality evidence; strong recommendation).
  context: Summary of recommendations made by the panel
  section: 表：Summary of recommendations made by the panel
  recommendation_strength: strong
  grade_letter: null
  evidence_certainty: moderate
  agreement: null
- statement: 'We recommend using mechanical thrombectomy in patients with occlusion involving the intracranial
    internal carotid artery, the first segment of the M1, or both, with symptom onset up to 8 hours (moderate-quality
    evidence, strong recommendation); provided that the following criteria are met: • NIHSS ≥ 6; • mRS
    ≤ 2 before the qualifying event.'
  context: Summary of recommendations made by the panel
  section: 表：Summary of recommendations made by the panel
  recommendation_strength: strong
  grade_letter: null
  evidence_certainty: moderate
  agreement: null
- statement: 'We recommend mechanical thrombectomy in patients with a symptom onset window between 8 and
    24 hours (moderate-quality evidence, strong recommendation); provided that the following criteria
    are met: • NIHSS ≥ 6; • mRS ≤ 2 before the qualifying event; • Infarct volume (assessed by perfusion
    or diffusion): - Less than 21 cm 3 (≥ 80 years; NIHSS > 10); - Less than 31 cm 3 (< 80 years; NIHSS:
    10–19); - Less than 51 cm 3 (< 80 years; NIHSS > 20); - Less than 70 cm 3 in patients with mismatch
    > 1.8, penumbra greater than 15 mL, and who present a symptom onset window between 8 and 16 hours.'
  context: Summary of recommendations made by the panel
  section: 表：Summary of recommendations made by the panel
  recommendation_strength: strong
  grade_letter: null
  evidence_certainty: moderate
  agreement: null
- statement: We suggest using general anesthesia or conscious sedation in patients eligible for mechanical
    thrombectomy at the discretion of the responsible team (low certainty of evidence, conditional recommendation).
  context: Summary of recommendations made by the panel
  section: 表：Summary of recommendations made by the panel
