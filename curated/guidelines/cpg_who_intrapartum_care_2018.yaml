- statement: RECOMMENDATION 5 The use of the following definitions of the latent and active first stages
    of labour is recommended for practice. — The latent first stage is a period of time characterized
    by painful uterine contractions and variable changes of the cervix, including some degree of effacement
    and slower progression of dilatation up to 5 cm for first and subsequent labours. (Recommended) —
    The active first stage is a period of time characterized by regular painful uterine contractions,
    a substantial degree of cervical effacement and more rapid cervical dilatation from 5 cm until full
    dilatation for first and subsequent labours. (Recommended)
  context: 3.2.1 Definitions of the latent and active first stages of labour
  section: RECOMMENDATION 5
  recommendation_strength: who_recommended
  grade_letter: null
  evidence_certainty: null
  agreement: null
  is_no_recommendation: false
- statement: RECOMMENDATION 6 Women should be informed that a standard duration of the latent first stage
    has not been established and can vary widely from one woman to another. However, the duration of active
    first stage (from 5 cm until full cervical dilatation) usually does not extend beyond 12 hours in
    first labours, and usually does not extend beyond 10 hours in subsequent labours. (Recommended)
  context: 3.2.2 Duration of the first stage of labour
  section: RECOMMENDATION 6
  recommendation_strength: who_recommended
  grade_letter: null
  evidence_certainty: null
  agreement: null
  is_no_recommendation: false
- statement: RECOMMENDATION 7 For pregnant women with spontaneous labour onset, the cervical dilatation
    rate threshold of 1 cm/hour during active first stage (as depicted by the partograph alert line) is
    inaccurate to identify women at risk of adverse birth outcomes and is therefore not recommended for
    this purpose. (Not recommended)
  context: 3.2.3 Progress of the first stage of labour
  section: RECOMMENDATION 7
  recommendation_strength: who_not_recommended
  grade_letter: null
  evidence_certainty: null
  agreement: null
  is_no_recommendation: false
- statement: RECOMMENDATION 8 A minimum cervical dilatation rate of 1 cm/hour throughout active first
    stage of labour is unrealistically fast for some women and is therefore not recommended for identification
    of normal labour progression. A slower than 1-cm/hour cervical dilatation rate alone should not be
    an indication for obstetric intervention. (Not recommended)
  context: S
  section: RECOMMENDATION 8
  recommendation_strength: who_not_recommended
  grade_letter: null
  evidence_certainty: null
  agreement: null
  is_no_recommendation: false
- statement: RECOMMENDATION 9 Labour may not naturally accelerate until a cervical dilatation threshold
    of 5 cm is reached. Therefore the use of medical interventions to accelerate labour and birth (such
    as oxytocin augmentation or caesarean section) before this threshold is not recommended, provided
    fetal and maternal conditions are reassuring. (Not recommended)
  context: for obstetric intervention. (Not recommended)
  section: RECOMMENDATION 9
  recommendation_strength: who_not_recommended
