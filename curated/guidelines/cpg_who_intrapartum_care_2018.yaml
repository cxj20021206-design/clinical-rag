- statement: RECOMMENDATION 1 Respectful maternity care – which refers to care organized for and provided
    to all women in a manner that maintains their dignity, privacy and confidentiality, ensures freedom
    from harm and mistreatment, and enables informed choice and continuous support during labour and childbirth
    – is recommended. (Recommended)
  context: 3.1.1 Respectful maternity care
