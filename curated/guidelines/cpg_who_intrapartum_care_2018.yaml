- statement: RECOMMENDATION 4 Midwife-led continuity-of-care models, in which a known midwife or small
    group of known midwives supports a woman throughout the antenatal, intrapartum and postnatal continuum,
    are recommended for pregnant women in settings with well functioning midwifery programmes. (Context-specific
    recommendation)
