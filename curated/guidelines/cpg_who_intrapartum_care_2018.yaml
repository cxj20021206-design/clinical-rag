- statement: RECOMMENDATION 33 The use of the following definition and duration of the second stage of
    labour is recommended for practice. — The second stage is the period of time between full cervical
    dilatation and birth of the baby, during which the woman has an involuntary urge to bear down, as
    a result of expulsive uterine contractions. (Recommended) — Women should be informed that the duration
    of the second stage varies from one woman to another. In first labours, birth is usually completed
    within 3 hours whereas in subsequent labours, birth is usually completed within 2 hours. (Recommended)
  context: 3.3.1 Definition and duration of the second stage of labour
  section: RECOMMENDATION 33
