- statement: When counseling critically ill patients with AIS or their surrogates, we suggest early neurological
    improvement (ENI) assessed 24 h following revascularization, or 24 h following admission for patients
    who are not candidates for revascularization, be considered a moderately reliable predictor of good
    functional outcome assessed at 3 months or later. A good outcome is expected in patients with recovery
    to an NIHSS of 0 to 1 at 24 h (weak recommendation; low quality evidence)
