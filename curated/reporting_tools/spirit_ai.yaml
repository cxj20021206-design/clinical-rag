# 策展摄入：SPIRIT-AI（含 AI 成分的临床试验"方案/protocol"扩展）
# 条目逐字取自 CC BY 全文 Table 1，仅摄入 AI 专属扩展/细化条目。
source_id: consort_spirit_ai
variant: SPIRIT-AI
name: SPIRIT-AI extension
issuing_body: SPIRIT-AI and CONSORT-AI Steering Group (EQUATOR Network)
document_type: reporting_guideline
source_role: reporting_tool
tier: 2
region: global

provenance:
  citation: >-
    Cruz Rivera S, Liu X, Chan AW, Denniston AK, Calvert MJ; SPIRIT-AI and CONSORT-AI Working
    Group. Guidelines for clinical trial protocols for interventions involving artificial
    intelligence: the SPIRIT-AI Extension. BMJ. 2020;370:m3210.
  doi: 10.1136/bmj.m3210
  pmid: "32907797"
  pmcid: PMC7490785
  canonical_url: https://doi.org/10.1136/bmj.m3210
  publication_date: "2020-09-09"
  license: CC BY 4.0
  license_note: 开放许可，须署名。同期于 Nature Medicine 与 Lancet Digital Health 发表姊妹版本。
  ingested_from: Europe PMC fullTextXML (PMC7490785) Table 1
  ingested_date: "2026-07-24"
  verbatim: true
  completeness: partial
  completeness_note: >-
    仅摄入 15 条 AI 专属扩展/细化条目。SPIRIT 2013 的通用方案条目（数据监查委员会、
    知情同意、保密、稽查等）刻意未摄入，理由同 CONSORT-AI。

applicability:
  study_designs: [clinical_trial_protocol]
  evidence_stages: [C4]
  modalities: [any]
  applies_when: 论文/文档是一份含 AI 干预成分的临床试验方案（protocol）。
  not_applicable_when: >-
    非试验方案的论文（绝大多数 MedAI 会议论文都不是）。误用会产生 "你没写数据监查计划"
    这类完全不适用的意见。
  note: 已完成试验的结果报告请用 CONSORT-AI。

items:
  - {id: "1 (i)", section: Title, base_item: "1", kind: elaboration, modules: [clinical_question],
     text: "Indicate that the intervention involves artificial intelligence/machine learning and specify the type of model."}
  - {id: "1 (ii)", section: Title, base_item: "1", kind: elaboration, modules: [clinical_question],
     text: "Specify the intended use of the AI intervention."}
  - {id: "6a (i)", section: Background and rationale, base_item: "6a", kind: extension, modules: [clinical_question, workflow_deployment],
     text: "Explain the intended use of the AI intervention in the context of the clinical pathway, including its purpose and its intended users."}
  - {id: "6a (ii)", section: Background and rationale, base_item: "6a", kind: extension, modules: [comparator_baseline, generalization],
     text: "Describe any pre-existing evidence for the AI intervention."}
  - {id: "9", section: Study setting, base_item: "9", kind: extension, modules: [workflow_deployment, generalization],
     text: "Describe the onsite and offsite requirements needed to integrate the AI intervention into the trial setting."}
  - {id: "10 (i)", section: Eligibility criteria, base_item: "10", kind: elaboration, modules: [population_validity],
     text: "State the inclusion and exclusion criteria at the level of participants."}
  - {id: "10 (ii)", section: Eligibility criteria, base_item: "10", kind: extension, modules: [population_validity, generalization],
     text: "State the inclusion and exclusion criteria at the level of the input data."}
  - {id: "11a (i)", section: Interventions, base_item: "11a", kind: extension, modules: [generalization],
     text: "State which version of the AI algorithm will be used."}
  - {id: "11a (ii)", section: Interventions, base_item: "11a", kind: extension, modules: [reference_standard, generalization],
     text: "Specify the procedure for acquiring and selecting the input data for the AI intervention."}
  - {id: "11a (iii)", section: Interventions, base_item: "11a", kind: extension, modules: [workflow_deployment, safety_harm_equity],
     text: "Specify the procedure for assessing and handling poor quality or unavailable input data."}
  - {id: "11a (iv)", section: Interventions, base_item: "11a", kind: extension, modules: [workflow_deployment],
     text: "Specify whether there is human-AI interaction in the handling of the input data, and what level of expertise is required for users."}
  - {id: "11a (v)", section: Interventions, base_item: "11a", kind: extension, modules: [endpoint_utility, workflow_deployment],
     text: "Specify the output of the AI intervention."}
  - {id: "11a (vi)", section: Interventions, base_item: "11a", kind: extension, modules: [workflow_deployment, endpoint_utility],
     text: "Explain the procedure for how the AI intervention's output will contribute to decision-making or other elements of clinical practice."}
  - {id: "22", section: Harms, base_item: "22", kind: extension, modules: [safety_harm_equity],
     text: "Specify any plans to identify and analyse performance errors. If there are no plans for this, justify why not."}
  - {id: "29", section: Access to data, base_item: "29", kind: extension, modules: [generalization, workflow_deployment],
     text: "State whether and how the AI intervention and/or its code can be accessed, including any restrictions to access or re-use."}
