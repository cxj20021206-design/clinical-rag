    name: 国家/地区官方统计系统
    source_role: epidemiology
    tier: 4
    region: [varies]
    clinical_domains: [all]
    document_types: [statistics]
    access_class: B
    machine_access: [varies]
    license_review_required: true
    url: ""
    modules: [population_validity, clinical_question]
    notes: "按 Claim Card 国家+care setting 动态选，不建'全球平均患者'"

# ---- 已延后的源 (2026-07-22 老师决定：国内源一般无 API/不易直接访问，先剔除) ----
# 保留记录以便日后中国部署场景需要时再接入 (届时多为 html/pdf 手工策展)。
deferred_sources:
  - id: nhc_china
    name: 国家卫生健康委员会 / 临床路径
    reason: "无统一开放许可/稳定公共 API；html/pdf 手工"
    url: "https://www.nhc.gov.cn/zwgkzt/lclj/list.shtml"
  - id: nmpa_cde_cmde
    name: NMPA / CDE / CMDE (中国药械监管)
    reason: "无统一 API；html/pdf"
    url: "https://www.cmde.org.cn/"
  - id: chictr
    name: 中国临床试验注册中心 ChiCTR
    reason: "无公共 API；html。可经 WHO ICTRP 间接发现"
    url: "https://www.chictr.org.cn/"

# ---- 不作为核心外部 RAG 的来源 (§6 排除) ----
exclusions:
  - "付费临床工具 (UpToDate/DynaMed/BMJ Best Practice)：权威但不满足开放免费约束"
  - "搜索引擎摘要 / 健康科普站 / 问答网站 / 医院营销页"
  - "单篇观点/社论/预印本 (除非明确标为低层级背景)"
  - "PubMed/Crossref/OpenAlex 命中记录本身 (发现层，非临床标准)"
  - "未标版本/已撤回/被新指南取代的文档"
  - "仅因'能免费下 PDF'就默认可批量抓取/向量化/再分发的内容"
