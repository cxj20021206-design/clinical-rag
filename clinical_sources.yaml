# clinical-rag 源注册表 (source registry)
# 把《MedAI 外部专业资料源清单 2026-07-21》编码成机器可路由的配置。
# 外部源只定义论文"应该证明什么"，绝不用来替论文证明它"实际做到了什么"。
schema_version: 1
compiled: "2026-07-22"

# ---- 图例 ----
access_class_legend:
  A: "开放许可 + 可机器获取 (API/XML/FTP/批量下载)"
  B: "免费阅读，但复用/批量/跨地区/商业可能受限，需逐项核对许可"
  C: "部分开放或需免费注册/签许可"
source_role_legend:
  normative: "规范标准：指南/临床路径/监管要求 —— 定义'应该要求什么'"
  evidence_synthesis: "系统综述/HTA/证据报告"
  regulatory: "药品/器械/SaMD 监管审评与要求"
  registry: "临床试验注册与结果"
  terminology: "术语/编码/互操作 (检索归一化，非临床推荐)"
  epidemiology: "疾病负担/患病率/现实人群"
  reporting_tool: "报告规范/偏倚/适用性工具 (路由用，非质量分)"
  discovery: "文献发现与开放全文入口 (非证据等级本身)"

# ---- 检索顺序 (固定；Claim Card 驱动) ----
retrieval_order:
  - clinical_claim_card          # 先抽取论文的 PICO/intended-use/证据阶段
  - region_and_specialty_routing # 按国家 + 专科路由
  - current_guideline_or_regulatory   # 现行指南/监管标准 (normative/regulatory)
  - systematic_review_or_hta     # 系统综述 / HTA
  - key_clinical_trials          # 关键注册试验
  - lower_tier_supplement        # 低层级补充证据
  - write_to_claim_evidence_graph  # 外部 requirement 与论文内部 evidence 分开写入

# ---- 八个审查模块 → 首选源角色 (§3 路由表) ----
module_routing:
  clinical_question:        [normative, epidemiology, evidence_synthesis]
  population_validity:      [normative, epidemiology, registry]
  reference_standard:       [normative, regulatory, terminology]
  comparator_baseline:      [normative, evidence_synthesis, regulatory]
  endpoint_utility:         [normative, evidence_synthesis]   # + COMET/FDA-COA/GRADE/NICE-ESF
  generalization:           [normative, registry, regulatory, reporting_tool]
  safety_harm_equity:       [normative, regulatory]           # + WHO AI ethics + 不良事件库
  workflow_deployment:      [reporting_tool, regulatory, normative]  # DECIDE-AI/NICE-ESF/GMLP/FHIR

sources:
  # ===== 2.1 临床指南 / 标准治疗 / 临床路径 (normative) =====
  - id: who_guidelines
    name: WHO Guidelines / IRIS
    source_role: normative
    tier: 1
    region: [global]
    clinical_domains: [all]
    document_types: [guideline]
    access_class: B
    machine_access: [html, pdf, oai_pmh]   # IRIS 部分支持 OAI-PMH
    license_review_required: true
    license: "常见 CC BY-NC-SA 3.0 IGO，逐文档核对"
    url: "https://iris.who.int/"
    modules: [clinical_question, comparator, endpoint, safety_harm_equity]
    notes: "第一优先；保存推荐原文/证据确定性/发布日期/适用国家"

  - id: nice_guidance
    name: NICE Guidance
    source_role: normative
    tier: 1
    region: [UK]
    clinical_domains: [all]
    document_types: [guideline, hta, dht_evidence]
    access_class: B
    machine_access: [api, html, pdf]
    license_review_required: true
    license: "免费阅读+API；国际复用(非个人研究)可能需许可付费"
    url: "https://www.nice.org.uk/guidance"
    modules: [comparator, endpoint, generalization, workflow_deployment]

  - id: uspstf
    name: USPSTF Recommendations
    source_role: normative
    tier: 1
    region: [US]
    clinical_domains: [screening, prevention]
    document_types: [recommendation]
    access_class: B
    machine_access: [html, pdf]
    license_review_required: true
    url: "https://www.uspreventiveservicestaskforce.org/uspstf/recommendation-topics"
    modules: [clinical_question, population_validity, endpoint_utility]
    notes: "筛查类第一优先；不能外推到治疗问题"

  - id: va_dod_cpg
    name: VA/DoD Clinical Practice Guidelines
    source_role: normative
    tier: 1
    region: [US]
    clinical_domains: [chronic_disease, mental_health, rehabilitation]
    document_types: [guideline]
    access_class: B
    machine_access: [pdf]
    license_review_required: false
    url: "https://www.healthquality.va.gov/"
    modules: [comparator, endpoint_utility, population_validity]

  - id: society_guidelines
    name: 专业学会指南门户 (ACR / AHA-ACC / ESC / IDSA ...)
    source_role: normative
    tier: 1
    region: [US, EU, varies]
    clinical_domains: [radiology, cardiology, infectious_disease, varies]
    document_types: [guideline, appropriateness_criteria]
    access_class: B
    machine_access: [html, pdf]
    license_review_required: true
    license: "多免费阅读；ACR 等复用需申请许可"
    url: "https://www.acr.org/clinical-resources/clinical-tools-and-reference/appropriateness-criteria"
    modules: [reference_standard, comparator, population_validity]
    notes: "按 Claim Card 动态路由；不能预先把所有学会文件当同一证据等级"

