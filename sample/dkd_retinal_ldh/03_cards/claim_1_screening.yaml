# 抽取卡（claim 1/2）—— 由 Claude 按 docs/EXTRACTOR_DESIGN.md 三阶段流程从 PDF 抽出。
# 论文：Non-invasive biopsy diagnosis of diabetic kidney disease via deep learning
#       applied to retinal images: a population-based study. Lancet Digit Health 2025.
# DOI: 10.1016/j.landig.2025.02.008
#
# 注：卡里不写"本篇有没有参照答案""属于哪个语料集"这类**过程元信息** ——
# 卡会原样进入阶段三的核查材料，那类注释是关于这篇论文的场外信息，会让核查者先入为主
# （prompts/stage2 §3 规则⑭）。样例的语料归属见 sample/dkd_retinal_ldh/README.md。
claim_card:
  paper_id: "10.1016/j.landig.2025.02.008"
  claim_id: claim_1

  # ⚠️ 本篇 PDF、本地元数据、Crossref **三处都没有收稿日**（SPEC §10 说"Received 一次命中"
  # 是 Nature 的特点，不通用）。此处取论文自报的**文献检索截止日**作保守下界：
  # 检索截止必然早于投稿，用它会让**更少**指南被判 predates=true，即更不容易拿作者
  # 投稿后才出现的标准去指责作者，符合项目铁律的安全侧。**此为待你确认的决定。**
  submission_date: "2024-03-10"
  region: "CN"

  gating:
    condition:
      primary: {label: "diabetic kidney disease", codes: {}}
      breadth: narrow
      scope_type: disease
      qualifiers: {}
      comorbid_context: ["diabetes"]
      excluded: []
    population:
      age_group: adult
      age_range_text: null          # 全文无年龄纳入标准（`aged NN` 零命中）
      special: []
    care_setting: primary_care
    clinical_task: screening
    evidence_stage: "C2"
    evidence_basis:
      clinical_claim_made: true
      external_cohort: true
      different_site: true          # 中国/新加坡/马来西亚/澳大利亚/英国十个数据集
      prospective: true             # 有前瞻真实世界研究，但终点是筛查准确性
      randomised: false
      deployed_in_care: false       # 论文自称 proof-of-concept，未见模型输出驱动照护决策
      endpoint_type: model_metric
    study_design: []
    intended_context: clinical_care
    finding_direction: positive

  descriptive:
    intended_use: "screening for diabetic kidney disease from retinal fundus images in primary care and low-resource settings, prioritising who needs confirmatory laboratory tests"
    target_population: "糖尿病患者；前瞻研究为 2 型糖尿病人群"
    intended_user: "基层医生（PCP）"
    model_input: "retinal fundus images"
    # ⚠️ 这里必须用英文：`infer_study_designs` 读 model_input/model_output 的**英文词表**
    # 来决定报告清单启停。初版写中文，TRIPOD+AI 与 PROBAST+AI 被静默关掉（见 §12）。
    model_output: "predicted probability score of diabetic kidney disease (binary label at a high-sensitivity operating point)"
    clinical_decision_affected: "是否建议进一步做尿 ACR 检查"
    comparator: "metadata model（XGBoost 临床元数据模型）、尿蛋白试纸"
    secondary_tasks: []
    claimed_benefit: "把 DeepDKD 并入 DKD 筛查流程可提高筛查敏感度，并在低资源基层优先挑出需做确证化验的患者"
    demonstrated_effect: "前瞻研究中敏感度 89·8% vs 元数据模型 66·3%（p<0·0001）；内部验证 AUC 0·842，外部 0·791–0·826"
    benefit_gap: "论文证明的是**筛查准确性**优于对照模型，未证明使用后患者肾功能结局改善或漏诊减少；'改善低资源可及性'为推论而非实测"
    future_intent: "作者提出随更便宜的手机眼底相机普及，该系统可作为同时筛查眼病与肾病的简易实时工具"
    deployment_claim_level: "proof-of-concept 前瞻真实世界研究（3 个月随访），非部署"
    clinical_context: |
      预训练 734 084 张眼底图；开发与内部验证用上海糖尿病预防与诊治整合系统 121 578 人的
      486 312 张图；外部验证十个多族裔数据集 65 406 人。前瞻研究：2023 年 1 月筛查 628 名
      2 型糖尿病患者，其中 502 人 eGFR≥60 且尿蛋白试纸阴性，325 人在 3 个月内完成 ACR
      检查（98 人 ACR 异常）。本字段不参与任何门控。

  provenance:
    # ⚠️ 必须指向**抽卡时实际读的解析产物**：表格内容只存在于 MinerU 输出里
    # （pypdf 文本中 `Number of participants with diabetes` 与各数据集年龄都查不到）。
    # 拿 MinerU 抽卡却用 pypdf 核验，会把解析层的能力差异误报成抽取故障。
    source: "sample/dkd_retinal_ldh/01_parse/10.1016_j.landig.2025.02.008/auto/10.1016_j.landig.2025.02.008_content_list.json"
    extraction: claude_llm_pipeline_v0    # 三阶段流程；未经人工核验
    input_coverage:
      - {part: main_text, included: true, note: "MinerU 版面解析，15 页，含 2 张结构化表格 + 12 图 + 4 图表"}
      - {part: appendix, included: false, note: "supplementary/appendix 未获取 —— 论文多处引用 appendix pp 7-10/44-45"}
    fields:
      condition.primary:
        status: explicit
        quote: "We aimed to develop and validate an artiﬁcial intelligence (AI) deep learning system to detect DKD and isolated diabetic nephropathy from retinal fundus images."
        locator: abstract
      population.age_group:
        status: inferred
        # ⚠️ 阶段三 Q6 指出：原引文只给了人数/病型，支持不了"成人"。改用主文表 1 的
        # 各数据集平均年龄（57–66 岁）作依据——但**不给 quote**：该表在两种解析下都
        # 无法给出可逐字引用的连续片段（pypdf 把表格逐字符逆序抽出；MinerU 还原了结构，
        # 但此表单元格顺序交错，"Age, years (45.34%) 66.05" 里的百分比来自另一行）。
        # 按 stage2 §⑩，inferred 允许无 quote，但 note 必须写清依据。宁可不给，
        # 也不拿一个交错拼出来的字符串冒充原文。
        note: "论文无显式年龄纳入标准；主文表 1 各数据集平均年龄 57.11–66.19 岁（SD 8–10），据此推断成人"
        locator: "table 1（MinerU 解析产物，pypdf 文本中不存在）"
      care_setting:
        status: explicit
        quote: "substantial efforts are devoted to developing rapid, simple, point-of-care tests to improve DKD screening in primary care settings"
        locator: introduction
      clinical_task:
        status: explicit
        quote: "a prospective real-world study with 3 months follow-up to evaluate the effectiveness of DeepDKD in screening DKD"
        locator: abstract
      comparator:
        status: explicit
        quote: "In the prospective study, compared with the metadata model, DeepDKD could detect DKD with higher sensitivity"
        locator: abstract
      evidence_stage:
        status: explicit
        quote: "ten multi-ethnic datasets from China, Singapore, Malaysia, Australia, and the UK (65 406 participants) for external validation"
        locator: abstract
      intended_context:
        status: explicit
        quote: "showed its potential for detecting DKD and differentiating isolated diabetic nephropathy from NDKD in clinical practice"
        locator: abstract
      future_intent:
        status: explicit
        quote: "our DeepDKD system could be adopted as a relatively simple, real-time tool for screening of both eye (diabetic retinopathy)"
        locator: discussion
