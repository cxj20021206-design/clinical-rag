        locator: "Figure 2（RIGHT）"
        note: "逐患者的四项指标只存在于图像文件中，纯文本取不到；离散程度与置信区间同样不可得。**不得用 Table 3 的数字代替**（那是另一套配置）。"
      descriptive.demonstrated_effect.lead_time_distribution:
