        quote: "Alerts for tuple v are issued as follows:"
        locator: "3.2.2 MAKING PREDICTIONS（式 (1) 之前）"
      descriptive.comparator:
        status: explicit
        quote: "Model performance using different k parameters. No pruning is performed on the graph. k = 2 is structurally equivalent to a Markov chain."
        locator: "Table 3 表注"
        cohort_id: ksweep_nopruning_15
        note: >-
          按 §4 第 3 条的判定动作（「论文有没有给出它与本方法的并列数字」）：只有模型自身变体给出了
          并列数字。Figure 5 的有/无监督与剪枝对比也是自身变体，且数值不在本次材料里。
          论文与已发表方法、与现行做法都**没有**并列数字，故 comparator 里不写它们
          （现行做法另记在 descriptive.current_practice，参考标准另记在 reference_standard）。
      descriptive.reference_standard:
        status: inferred
        quote: "The hypoglycemia threshold is set at 70 mg/dL."
        locator: "3.1 DATA, TRANSFORMATION, AND DISCRETIZATION"
        note: >-
          阈值本身是明写的；「真值与模型输入同源、无独立参考标准」是本卡的归纳（全文找过：
          无静脉血浆血糖、无症状记录、无临床判读、无登记库编码），故标 inferred。
      descriptive.current_practice:
        status: explicit
        quote: "Self-Monitoring of hypoglycemia is a key component of diabetes care, along with carbohydrate counting and adjusting insulin dose."
        locator: "1 INTRODUCTION"
        note: "这是论文自陈的现行做法。**论文没有与它做过任何比较**（head-to-head = false）。"
      descriptive.claimed_benefit:
        status: explicit
        quote: "We can then use paths in the graph to anticipate hypoglycemia in advance of about 30 minutes sufficient for a clinical setting and additionally find actionable rules that accurate and effective."
        locator: "ABSTRACT"
        note: >-
          逐字取自作者原话，未加任何原文没有的限定词。取摘要版是因为它是这条主张最完整的表述：
          §1 的正文版只有「30 分钟 + acceptable clinical accuracy」，不含 "sufficient for a clinical
          setting" 与 "actionable rules" 这两半（那半已另作 descriptive.intended_use 的出处）。
      descriptive.demonstrated_effect:
        status: explicit
        quote: "In total, our model preemptively issued warnings for 272 hypoglycemia instances and missed 10, achieving a 96.45% warning rate."
        locator: "4.2 EVALUATION RESULTS"
